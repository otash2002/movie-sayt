version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: nest_auth_db_container
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: otash2002
      POSTGRES_DB: nest_auth_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - nest-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nest_auth_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: nest_api_container
    restart: unless-stopped
    ports:
      - "3005:3000"
    environment:
      DATABASE_URL: postgresql://postgres:otash2002@db:5432/nest_auth_db?schema=public
      JWT_SECRET: super-secret-jwt-key-otash2002
      JWT_EXPIRES_IN: 7d
      PORT: 3000
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    networks:
      - nest-network
    volumes:
      - ./uploads:/app/uploads

volumes:
  postgres_data:

networks:
  nest-network:
    driver: bridge